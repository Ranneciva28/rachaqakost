name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint PHP
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate cached routes and views
        run: |
          php artisan route:cache
          php artisan view:cache
      - name: Build production container
        run: docker build --tag rachaqakost-ci .
      - name: Validate Apache configuration
        run: docker run --rm --entrypoint apache2ctl rachaqakost-ci -t
      - name: Smoke-test production web server
        run: |
          app_key="base64:$(openssl rand -base64 32)"
          container_id=$(docker run --detach \
            --publish 127.0.0.1:8080:80 \
            --env APP_ENV=testing \
            --env APP_KEY="$app_key" \
            --env SESSION_DRIVER=array \
            --env CACHE_STORE=array \
            --entrypoint apache2-foreground \
            rachaqakost-ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/up; then
              exit 0
            fi
            sleep 1
          done
          exit 1
